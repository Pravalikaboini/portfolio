<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Me</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 0;
}

.contact-section {
  max-width: 500px;
  margin: 50px auto;
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
.navbar {
  list-style: none;
  display: flex;
  gap: 20px;
  padding: 0;
  margin: 20px 0;
  justify-content: center; 
}

.navbar li a {
  text-decoration: none;
  color: #007bff;
  font-weight: bold;
}

.navbar li a:hover {
  color: #0056b3;
}
h2 {
  text-align: center;
  color: #333;
}

form {
  display: flex;
  flex-direction: column;
}

input, textarea {
  margin-bottom: 15px;
  padding: 10px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button {
  padding: 10px;
  background: #007bff;
  color: white;
  border: none;
  font-size: 16px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.3s;
}

button:hover {
  background: #0056b3;
}

#formResponse {
  margin-top: 15px;
  text-align: center;
  color: green;
}

  </style>
</head>
<body>
  <section class="contact-section">
    <h2>Contact Me</h2>
    <nav>
      <ul class="navbar">
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contactme.html">Contact</a></li>
      </ul>
    </nav>
    
    

    <form id="contactForm">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <textarea id="message" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
    <p id="formResponse"></p>
    
  </section>

  <script>document.getElementById("contactForm").addEventListener("submit", function (e) {
    e.preventDefault();
  
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message").value.trim();
  
    if (!name || !email || !message) {
      document.getElementById("formResponse").textContent = "Please fill in all fields.";
      document.getElementById("formResponse").style.color = "red";
      return;
    }
  
    // Simulate success (replace with backend integration later)
    document.getElementById("formResponse").textContent = "Thank you! Message sent successfully.";
    document.getElementById("formResponse").style.color = "green";
  
    // Reset form
    document.getElementById("contactForm").reset();
  });
  </script>
</body>
</html>
