<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Web Projects</title>
<style>
    body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to right, #b2dfdb, #e0f7fa);
  margin: 0;
  padding: 40px 20px;
  text-align: center;
}

.home-container {
  max-width: 800px;
  margin: auto;
}

h1 {
  color: #004d40;
  margin-bottom: 40px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  justify-items: center;
}

.card {
  background-color: #ffffff;
  color: #004d40;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
  text-decoration: none;
  font-size: 1.2rem;
  font-weight: bold;
  transform: scale(0.95);
  opacity: 0;
  transition: transform 0.4s ease, opacity 0.4s ease;
}

.card:hover {
  transform: scale(1.03);
}

.card.show {
  opacity: 1;
  transform: scale(1);
}



</style>
</head>
<body>
  <div class="home-container">
    <h1>My Projects</h1>
    <div class="cards">
      <a href="index2.html" class="card fade-in">Portfolio</a>
      <a href="todo.html" class="card fade-in">To-Do List</a>
      <a href="product.html" class="card fade-in">Product List</a>
    </div>
  </div>

  <script>
    // Add fade-in class after load
    document.querySelectorAll('.card').forEach((card, index) => {
      setTimeout(() => card.classList.add('show'), 150 * index);
    });
  </script>
</body>
</html>
